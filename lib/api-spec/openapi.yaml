openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and profile
  - name: tickets
    description: Support ticket workflows
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: users
    description: User administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid registration
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get role-aware ticket statistics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not signed in
  /dashboard/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [dashboard]
      summary: Get administrator analytics
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "403":
          description: Administrator access required
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent system activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "403":
          description: Administrator access required
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets visible to the current user
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        - in: query
          name: priority
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          description: Not signed in
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Invalid ticket
  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket details and comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetails"
        "404":
          description: Ticket not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket status or assignment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdateInput"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "403":
          description: Not allowed
  /tickets/{id}/comments:
    post:
      operationId: addTicketComment
      tags: [tickets]
      summary: Add a comment to a ticket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /agents:
    get:
      operationId: listAgents
      tags: [users]
      summary: List support agents for assignment
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List registered users for administrators
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Administrator access required
  /users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Change a user's role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [USER, AGENT, ADMIN] }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, role, createdAt]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]
    Ticket:
      type: object
      properties:
        id: { type: integer }
        ticketNumber: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        createdById: { type: integer }
        createdByName: { type: string }
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ticketNumber, title, description, category, priority, status, createdById, createdByName, assignedToId, assignedToName, createdAt, updatedAt]
    Comment:
      type: object
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        authorId: { type: integer }
        authorName: { type: string }
        authorRole: { type: string, enum: [USER, AGENT, ADMIN] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, ticketId, authorId, authorName, authorRole, body, createdAt]
    TicketDetails:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
      required: [ticket, comments]
    TicketInput:
      type: object
      properties:
        title: { type: string, minLength: 5 }
        description: { type: string, minLength: 10 }
        category: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
      required: [title, description, category, priority]
    TicketUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        assignedToId: { type: ["integer", "null"] }
    CommentInput:
      type: object
      properties:
        body: { type: string, minLength: 1 }
      required: [body]
    DashboardSummary:
      type: object
      properties:
        total: { type: integer }
        open: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        closed: { type: integer }
        tickets: 
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
      required: [total, open, inProgress, resolved, closed, tickets]
    AdminAnalytics:
      type: object
      properties:
        totalTickets: { type: integer }
        openTickets: { type: integer }
        inProgressTickets: { type: integer }
        resolvedTickets: { type: integer }
        totalUsers: { type: integer }
        totalAgents: { type: integer }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required: [totalTickets, openTickets, inProgressTickets, resolvedTickets, totalUsers, totalAgents, byStatus, byCategory]
    StatusCount:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
      required: [status, count]
    CategoryCount:
      type: object
      properties:
        category: { type: string }
        count: { type: integer }
      required: [category, count]
    Activity:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        actorName: { type: string }
        ticketNumber: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, action, actorName, ticketNumber, createdAt]
    UserRoleInput:
      type: object
      properties:
        role: { type: string, enum: [USER, AGENT, ADMIN] }
      required: [role]

